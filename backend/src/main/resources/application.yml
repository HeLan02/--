server:
  port: 8080

spring:
  application:
    name: classroom-free-status
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  period:
    # 节次 -> 时间段，仅用于前端展示/可扩展；核心冲突逻辑仍以节次区间判断
    1: "08:00-08:45"
    2: "08:55-09:40"
    3: "10:00-10:45"
    4: "10:55-11:40"
    5: "14:00-14:45"
    6: "14:55-15:40"
    7: "16:00-16:45"
    8: "16:55-17:40"
    9: "19:00-19:45"
    10: "19:55-20:40"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:cfs;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  h2:
    console:
      enabled: true
      path: /h2
  flyway:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/cfs?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true

